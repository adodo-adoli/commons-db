<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in — {{ schema.display_name }}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
</head>
<body class="login-page">
<div class="login-wrap">
  <div class="login-card">
    <div class="login-logo">
      <span class="logo-dot"></span>
      <span>{{ schema.display_name }}</span>
    </div>
    <p class="login-desc">{{ schema.description }}</p>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="flash flash-{{ category }}">{{ message }}</div>
      {% endfor %}
    {% endwith %}

    <form method="post" class="login-form">
      <label class="field-label">Username</label>
      <input type="text" name="username" autocomplete="username" autofocus required>
      <label class="field-label">Password</label>
      <input type="password" name="password" autocomplete="current-password" required>
      <button type="submit" class="btn-primary">Log in</button>
    </form>
  </div>
</div>
</body>
</html>
